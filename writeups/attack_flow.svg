<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">MFA Replay Attack Flow</title>
  <desc id="desc">Diagram showing victim browser -&gt; Evilginx2 -&gt; Real Service -&gt; captured tokens -&gt; attacker replay</desc>

  <!-- Marker for arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Victim Browser -->
  <rect x="28" y="30" width="160" height="60" rx="6" ry="6"
        fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <text x="48" y="55" fill="#0f172a" font-size="13" font-family="Arial, Helvetica, sans-serif">Victim Browser</text>
  <text x="34" y="75" fill="#475569" font-size="12" font-family="Arial, Helvetica, sans-serif">(clicks phishing URL / submits credentials + MFA)</text>

  <!-- Arrow to Proxy -->
  <path d="M110 90 L110 135" stroke="#0f172a" stroke-width="1.6" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Evilginx2 Proxy -->
  <rect x="250" y="110" width="260" height="100" rx="6" ry="6"
        fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="280" y="140" fill="#0f172a" font-size="13" font-family="Arial, Helvetica, sans-serif">Evilginx2 (Adversary-in-the-Middle)</text>
  <text x="280" y="160" fill="#475569" font-size="12" font-family="Arial, Helvetica, sans-serif">- Forwards traffic</text>
  <text x="280" y="178" fill="#475569" font-size="12" font-family="Arial, Helvetica, sans-serif">- Captures credentials &amp; session cookies</text>

  <!-- Arrow to Real Service -->
  <path d="M370 210 L370 260" stroke="#0f172a" stroke-width="1.6" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Real Service -->
  <rect x="240" y="260" width="220" height="60" rx="6" ry="6"
        fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <text x="275" y="295" fill="#0f172a" font-size="13" font-family="Arial, Helvetica, sans-serif">Real Service / Identity Provider</text>
  <text x="270" y="312" fill="#475569" font-size="12" font-family="Arial, Helvetica, sans-serif">(issues session tokens / cookies)</text>

  <!-- Captured tokens stored -->
  <rect x="540" y="130" width="170" height="60" rx="6" ry="6"
        fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <text x="560" y="155" fill="#0f172a" font-size="13" font-family="Arial, Helvetica, sans-serif">Captured Tokens</text>
  <text x="548" y="175" fill="#475569" font-size="12" font-family="Arial, Helvetica, sans-serif">(stored on Evilginx2)</text>

  <!-- Dashed line from Proxy to Captured tokens -->
  <path d="M460 150 L540 150" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Attacker Workspace -->
  <rect x="540" y="220" width="170" height="70" rx="6" ry="6"
        fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <text x="560" y="248" fill="#0f172a" font-size="13" font-family="Arial, Helvetica, sans-serif">Attacker Workspace</text>
  <text x="548" y="268" fill="#475569" font-size="12" font-family="Arial, Helvetica, sans-serif">(export cookies → import with Cookie Editor)</text>

  <!-- Arrow to Attacker Browser -->
  <path d="M640 290 L640 350" stroke="#0f172a" stroke-width="1.6" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Attacker Browser -->
  <rect x="520" y="350" width="220" height="50" rx="6" ry="6"
        fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <text x="560" y="380" fill="#0f172a" font-size="13" font-family="Arial, Helvetica, sans-serif">Attacker Browser — impersonates victim</text>
  <text x="548" y="398" fill="#475569" font-size="12" font-family="Arial, Helvetica, sans-serif">(MFA bypass via session replay)</text>

  <!-- Context connector -->
  <path d="M470 220 L540 220" stroke="#0f172a" stroke-width="1.2" fill="none" marker-end="url(#arrowhead)"/>
</svg>
